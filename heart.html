<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Mini Heart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: rgba(10, 10, 28, 0.85);
            backdrop-filter: blur(15px);
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            border-radius: 50%;
            border: 1px solid rgba(244, 63, 94, 0.4);
            cursor: pointer;
            user-select: none;
        }
        .heart {
            font-size: 38px;
            line-height: 1;
            animation: pulse 2.2s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.8));
            transition: transform 0.2s ease;
        }
        body:hover .heart {
            transform: scale(1.25);
            filter: drop-shadow(0 0 20px rgba(244, 63, 94, 1));
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.18); }
            28% { transform: scale(1); }
            42% { transform: scale(1.12); }
            56% { transform: scale(1); }
        }
    </style>
</head>
<body title="Click to open ADHD Flow Widget">
    <div class="heart">❤️</div>
    <script src="js/heart-open.js"></script>
</body>
</html>
